<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ecfdf5">
    <title>Registration successful</title>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            background: linear-gradient(155deg, #ecfdf5 0%, #ffffff 52%, #f0fdfa 100%);
            color: #0f172a;
        }
        main {
            width: min(100%, 420px);
            padding: 44px 28px 34px;
            text-align: center;
            background: rgba(255,255,255,.96);
            border: 1px solid #bbf7d0;
            border-radius: 32px;
            box-shadow: 0 24px 70px rgba(15,118,110,.14);
        }
        .check {
            width: 92px;
            height: 92px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(145deg, #10b981, #14b8a6);
            color: white;
            font-size: 52px;
            font-weight: 900;
            box-shadow: 0 16px 34px rgba(16,185,129,.28);
        }
        h1 { margin: 0; font-size: clamp(30px, 8vw, 40px); line-height: 1.12; letter-spacing: -.035em; }
        p { margin: 16px auto 0; max-width: 32ch; color: #64748b; font-size: 17px; font-weight: 600; line-height: 1.65; }
        a {
            min-height: 56px;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #10b981;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: 850;
            box-shadow: 0 12px 26px rgba(16,185,129,.24);
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
        }
        a:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 16px 30px rgba(16,185,129,.3); }
        a:active { transform: scale(.985); }
        a:focus-visible { outline: 3px solid rgba(16,185,129,.38); outline-offset: 4px; }
        .brand { margin-top: 22px; color: #059669; font-size: 11px; font-weight: 900; letter-spacing: .17em; }
        @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
</head>
<body>
    <main aria-labelledby="success-title">
        <div class="check" aria-hidden="true">✓</div>
        <h1 id="success-title">Registration successful</h1>
        <p>Your email address has been confirmed. Your Science Vocab account is now registered.</p>
        <a href="./blank-flashcard-app.html">Continue to sign in</a>
        <div class="brand">SCIENCE VOCAB FLASHCARDS</div>
    </main>
</body>
</html>
